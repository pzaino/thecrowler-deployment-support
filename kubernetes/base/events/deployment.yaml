apiVersion: apps/v1
kind: Deployment
metadata:
  name: crowler-events
  namespace: crowler
  labels:
    app.kubernetes.io/name: crowler-events
    app.kubernetes.io/part-of: thecrowler
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: crowler-events
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crowler-events
        app.kubernetes.io/part-of: thecrowler
    spec:
      automountServiceAccountToken: false
      containers:
        - name: crowler-events
          image: zfpsystems/crowler-events:2.0.3
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8082
          envFrom:
            - secretRef:
                name: crowler-secrets
                optional: true
          env:
            - name: INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POSTGRES_DB
              value: SitesIndex
            - name: CROWLER_DB_USER
              valueFrom:
                secretKeyRef:
                  name: crowler-secrets
                  key: DOCKER_CROWLER_DB_USER
            - name: CROWLER_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: crowler-secrets
                  key: DOCKER_CROWLER_DB_PASSWORD
            - name: POSTGRES_DB_HOST
              value: crowler-db
            - name: POSTGRES_DB_PORT
              value: "5432"
            - name: POSTGRES_SSL_MODE
              value: disable
            - name: TZ
              value: UTC
            - name: MICROSERVICE_NAME
              value: crowler-events
          securityContext:
            readOnlyRootFilesystem: true
          readinessProbe:
            exec:
              command:
                - ./healthCheck
                - -service
                - events
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - ./healthCheck
                - -service
                - events
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          volumeMounts:
            - name: crowler-config
              mountPath: /app/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: events-data
              mountPath: /app/data
      volumes:
        - name: crowler-config
          configMap:
            name: crowler-config
            items:
              - key: config.yaml
                path: config.yaml
        - name: events-data
          emptyDir: {}
