apiVersion: apps/v1
kind: Deployment
metadata:
  name: crowler-jaeger
  namespace: crowler
  labels:
    app.kubernetes.io/name: crowler-jaeger
    app.kubernetes.io/part-of: thecrowler
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: crowler-jaeger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crowler-jaeger
        app.kubernetes.io/part-of: thecrowler
    spec:
      automountServiceAccountToken: false
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.54
          imagePullPolicy: IfNotPresent
          ports:
            - name: ui
              containerPort: 16686
            - name: otlp-grpc
              containerPort: 4317
          env:
            - name: COLLECTOR_ZIPKIN_HTTP_PORT
              value: "9411"
            - name: JAEGER_SERVICE_NAME
              value: crowler-jaeger
          readinessProbe:
            tcpSocket:
              port: ui
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
