name: Smoke published CROWler deployment

on:
  workflow_dispatch:
    inputs:
      crowler_version:
        description: CROWler image tag to smoke test
        required: true
        default: latest
        type: string
      vdi_version:
        description: CROWler VDI image tag to smoke test
        required: true
        default: 4.28.1-20260819
        type: string

permissions:
  contents: read

concurrency:
  group: crowler-deployment-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compose-image-smoke:
    name: Compose runtime smoke (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Prepare smoke deployment
        shell: bash
        env:
          CROWLER_VERSION_INPUT: ${{ inputs.crowler_version }}
          CROWLER_VDI_VERSION_INPUT: ${{ inputs.vdi_version }}
        run: |
          set -euo pipefail

          cp common/env/env_template .env
          cp common/config/config.default config.yaml

          sed -i "s/^CROWLER_VERSION=.*/CROWLER_VERSION=${CROWLER_VERSION_INPUT}/" .env
          sed -i "s/^CROWLER_VDI_VERSION=.*/CROWLER_VDI_VERSION=${CROWLER_VDI_VERSION_INPUT}/" .env
          sed -i "s/^DOCKER_POSTGRES_PASSWORD=.*/DOCKER_POSTGRES_PASSWORD='smoke-only'/" .env
          sed -i "s/^DOCKER_CROWLER_DB_PASSWORD=.*/DOCKER_CROWLER_DB_PASSWORD='smoke-only'/" .env
          sed -i "s/^SEL_PASSWD=.*/SEL_PASSWD='smoke-only'/" .env
          printf 'SE_ENABLE_TRACING=false\n' >> .env

          ./docker-compose/generate-docker-compose.sh \
            -e=1 \
            -v=1 \
            --prom=no \
            --pg=yes \
            --no_jaeger

          docker compose config >/dev/null

      - name: Pull published images
        run: docker compose pull

      - name: Verify native image architecture
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          CROWLER_VERSION_INPUT: ${{ inputs.crowler_version }}
          CROWLER_VDI_VERSION_INPUT: ${{ inputs.vdi_version }}
        run: |
          set -euo pipefail

          for image in \
            "zfpsystems/crowler-db:${CROWLER_VERSION_INPUT}" \
            "zfpsystems/crowler-engine:${CROWLER_VERSION_INPUT}" \
            "zfpsystems/crowler-api:${CROWLER_VERSION_INPUT}" \
            "zfpsystems/crowler-events:${CROWLER_VERSION_INPUT}" \
            "zfpsystems/crowler-vdi:${CROWLER_VDI_VERSION_INPUT}"; do
            actual_os="$(docker image inspect "$image" --format '{{.Os}}')"
            actual_arch="$(docker image inspect "$image" --format '{{.Architecture}}')"
            echo "$image -> $actual_os/$actual_arch"
            if [ "$actual_os/$actual_arch" != "linux/$EXPECTED_ARCH" ]; then
              echo "ERROR: expected linux/$EXPECTED_ARCH for $image, got $actual_os/$actual_arch" >&2
              exit 1
            fi
          done

      - name: Verify expected services
        shell: bash
        run: |
          set -euo pipefail
          services="$(docker compose config --services)"
          for required in crowler-db crowler-engine-1 crowler-vdi-1 crowler-api crowler-events; do
            if ! grep -Fxq "$required" <<<"$services"; then
              echo "ERROR: expected Compose service was not generated: $required" >&2
              exit 1
            fi
          done

      - name: Start smoke deployment
        run: |
          docker compose up -d
          docker compose ps -a

      - name: Wait for runtime health
        shell: bash
        run: |
          set -euo pipefail

          wait_for_service() {
            local service="$1"
            local require_health="$2"
            local deadline=$((SECONDS + 600))

            while [ "$SECONDS" -lt "$deadline" ]; do
              local container_id
              container_id="$(docker compose ps -q "$service")"
              if [ -n "$container_id" ]; then
                local state health
                state="$(docker inspect "$container_id" --format '{{.State.Status}}')"
                health="$(docker inspect "$container_id" --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}')"
                echo "$service state=$state health=$health"

                if [ "$require_health" = "yes" ] && [ "$health" = "healthy" ]; then
                  return 0
                fi
                if [ "$require_health" = "no" ] && [ "$state" = "running" ]; then
                  return 0
                fi
                if [ "$state" = "exited" ] || [ "$state" = "dead" ]; then
                  docker logs "$container_id" || true
                  return 1
                fi
              fi
              sleep 10
            done

            echo "ERROR: timed out waiting for $service" >&2
            docker compose ps -a
            return 1
          }

          wait_for_service crowler-db yes
          wait_for_service crowler-vdi-1 no
          wait_for_service crowler-api yes
          wait_for_service crowler-events yes
          wait_for_service crowler-engine-1 yes

      - name: Show final smoke status
        run: docker compose ps -a

      - name: Clean smoke deployment
        if: always()
        run: |
          docker compose logs --no-color --tail=100 || true
          docker compose down -v --remove-orphans || true
          rm -f .env config.yaml docker-compose.yml
