name: Validate deployment support

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deployment-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  NOMAD_VERSION: '1.10.4'
  TERRAFORM_VERSION: '1.15.0'

jobs:
  static-and-agent-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck jq

      - name: Validate repository structure, shell, and AI skills
        run: bash ./scripts/validate-deployment-support.sh static

  docker-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Docker versions
        run: |
          docker version
          docker compose version

      - name: Validate generated Docker Compose deployment
        run: bash ./scripts/validate-deployment-support.sh compose

      - name: Validate generated Docker Swarm deployment
        run: bash ./scripts/validate-deployment-support.sh swarm

  kubernetes-and-helm-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Validate raw Kubernetes manifests
        run: bash ./scripts/validate-deployment-support.sh kubernetes

      - name: Validate Helm chart
        run: bash ./scripts/validate-deployment-support.sh helm

  nomad-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq unzip

      - name: Install Nomad CLI
        shell: bash
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          case "$arch" in
            x86_64) nomad_arch=amd64 ;;
            aarch64|arm64) nomad_arch=arm64 ;;
            *) echo "ERROR: unsupported runner architecture: $arch" >&2; exit 1 ;;
          esac

          curl -fsSLo /tmp/nomad.zip \
            "https://releases.hashicorp.com/nomad/${NOMAD_VERSION}/nomad_${NOMAD_VERSION}_linux_${nomad_arch}.zip"
          unzip -q /tmp/nomad.zip -d /tmp/nomad-bin
          sudo install -m 0755 /tmp/nomad-bin/nomad /usr/local/bin/nomad
          nomad version

      - name: Validate Nomad deployment
        run: bash ./scripts/validate-deployment-support.sh nomad

  terraform-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Validate Terraform Helm and Nomad roots
        run: bash ./scripts/validate-deployment-support.sh terraform
