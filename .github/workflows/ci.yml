name: Validate deployment support

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deployment-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  NOMAD_VERSION: '1.10.4'
  TERRAFORM_VERSION: '1.15.0'
  KUBECONFORM_VERSION: '0.8.0'

jobs:
  static-and-agent-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck jq

      - name: Validate repository structure, shell, versions, and AI skills
        run: bash ./scripts/validate-deployment-support.sh static

  docker-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Show Docker versions
        run: |
          docker version
          docker compose version

      - name: Validate generated Docker Compose deployment
        run: bash ./scripts/validate-deployment-support.sh compose

      - name: Validate generated Docker Swarm deployment
        run: bash ./scripts/validate-deployment-support.sh swarm

  kubernetes-and-helm-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4

      - name: Install kubeconform
        shell: bash
        run: |
          set -euo pipefail
          archive="kubeconform-linux-amd64.tar.gz"
          curl -fsSLo "/tmp/$archive" \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/$archive"
          echo "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883  /tmp/$archive" | sha256sum -c -
          tar -xzf "/tmp/$archive" -C /tmp kubeconform
          sudo install -m 0755 /tmp/kubeconform /usr/local/bin/kubeconform
          kubeconform -v

      - name: Validate raw Kubernetes manifests
        run: bash ./scripts/validate-deployment-support.sh kubernetes

      - name: Validate Helm chart
        run: bash ./scripts/validate-deployment-support.sh helm

  nomad-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq unzip

      - name: Install checksum-verified Nomad CLI
        shell: bash
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          case "$arch" in
            x86_64) nomad_arch=amd64 ;;
            aarch64|arm64) nomad_arch=arm64 ;;
            *) echo "ERROR: unsupported runner architecture: $arch" >&2; exit 1 ;;
          esac

          archive="nomad_${NOMAD_VERSION}_linux_${nomad_arch}.zip"
          base="https://releases.hashicorp.com/nomad/${NOMAD_VERSION}"
          curl -fsSLo "/tmp/$archive" "$base/$archive"
          curl -fsSLo /tmp/NOMAD_SHA256SUMS "$base/nomad_${NOMAD_VERSION}_SHA256SUMS"
          (cd /tmp && grep "  ${archive}$" NOMAD_SHA256SUMS | sha256sum -c -)
          unzip -q "/tmp/$archive" -d /tmp/nomad-bin
          sudo install -m 0755 /tmp/nomad-bin/nomad /usr/local/bin/nomad
          nomad version

      - name: Validate Nomad deployment
        run: bash ./scripts/validate-deployment-support.sh nomad

  terraform-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Validate Terraform Helm and Nomad roots
        run: bash ./scripts/validate-deployment-support.sh terraform

  validation-gate:
    name: Validation gate
    if: always()
    runs-on: ubuntu-latest
    needs:
      - static-and-agent-validation
      - docker-validation
      - kubernetes-and-helm-validation
      - nomad-validation
      - terraform-validation
    steps:
      - name: Require every deployment validator
        shell: bash
        run: |
          set -euo pipefail
          test "${{ needs.static-and-agent-validation.result }}" = "success"
          test "${{ needs.docker-validation.result }}" = "success"
          test "${{ needs.kubernetes-and-helm-validation.result }}" = "success"
          test "${{ needs.nomad-validation.result }}" = "success"
          test "${{ needs.terraform-validation.result }}" = "success"
