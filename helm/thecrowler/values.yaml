global:
  crowlerVersion: "2.1.0"
  vdiVersion: "4.28.1-20260819"
  imagePullPolicy: IfNotPresent
  timezone: UTC

config:
  create: false
  existingConfigMap: crowler-config
  content: ""
  # Change this value during a Helm upgrade when an externally managed
  # ConfigMap changes and you want Helm to roll Engine/API/Events pods.
  rolloutToken: ""

secrets:
  create: false
  existingSecret: crowler-secrets
  # Change this value during a Helm upgrade when an externally managed
  # Secret changes and you want Helm to roll workloads.
  rolloutToken: ""
  data:
    postgresPassword: ""
    crowlerDbUser: crowler
    crowlerDbPassword: ""
    seleniumPassword: ""

# Optional deployment-specific CROWler content.
#
# These ConfigMaps are managed externally (Terraform, kubectl, GitOps, etc.)
# and mounted without masking the built-in /app/{agents,plugins,rules,support}.
userContent:
  enabled: false
  agentsConfigMap: ""
  pluginsConfigMap: ""
  rulesConfigMap: ""
  supportConfigMap: ""
  rolloutToken: ""

database:
  enabled: true
  image:
    repository: zfpsystems/crowler-db
  # Used only when database.enabled=false.
  host: ""
  port: 5432
  name: SitesIndex
  postgresUser: postgres
  sslMode: disable
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}

api:
  enabled: true
  replicas: 1
  image:
    repository: zfpsystems/crowler-api
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 1Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}

events:
  enabled: true
  replicas: 1
  image:
    repository: zfpsystems/crowler-events
  service:
    type: ClusterIP
    port: 8082
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 1Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}

engine:
  enabled: true
  replicas: 2
  image:
    repository: zfpsystems/crowler-engine
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}

vdi:
  enabled: true
  replicas: 2
  image:
    repository: zfpsystems/crowler-vdi
  service:
    type: ClusterIP
    sessionAffinity: ClientIP
    sessionAffinityTimeoutSeconds: 10800
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi
  shmSizeLimit: 2Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}

jaeger:
  enabled: true
  image:
    repository: jaegertracing/all-in-one
    tag: "1.54"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 1Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}

pushgateway:
  enabled: true
  image:
    repository: prom/pushgateway
    tag: latest
    pullPolicy: Always
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 512Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
