{{- if .Values.database.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: crowler-db
  labels:
    app.kubernetes.io/name: crowler-db
    {{- include "thecrowler.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: crowler-db
  ports:
    - name: postgres
      port: {{ .Values.database.port }}
      targetPort: postgres
{{- end }}
