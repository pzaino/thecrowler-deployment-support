{{- if .Values.config.create }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "thecrowler.configMapName" . }}
  labels:
    {{- include "thecrowler.labels" . | nindent 4 }}
data:
  config.yaml: |
{{ required "config.content must be supplied when config.create=true" .Values.config.content | nindent 4 }}
{{- end }}
