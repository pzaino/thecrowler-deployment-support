{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "thecrowler.secretName" . }}
  labels:
    {{- include "thecrowler.labels" . | nindent 4 }}
type: Opaque
stringData:
  DOCKER_POSTGRES_PASSWORD: {{ .Values.secrets.data.postgresPassword | quote }}
  DOCKER_CROWLER_DB_USER: {{ required "secrets.data.crowlerDbUser is required" .Values.secrets.data.crowlerDbUser | quote }}
  DOCKER_CROWLER_DB_PASSWORD: {{ required "secrets.data.crowlerDbPassword is required when secrets.create=true" .Values.secrets.data.crowlerDbPassword | quote }}
  SEL_PASSWD: {{ required "secrets.data.seleniumPassword is required when secrets.create=true" .Values.secrets.data.seleniumPassword | quote }}
{{- end }}
