{{- if .Values.api.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "thecrowler.apiName" . }}
  labels:
    app.kubernetes.io/name: crowler-api
    {{- include "thecrowler.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: crowler-api
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crowler-api
        app.kubernetes.io/part-of: thecrowler
        app.kubernetes.io/instance: {{ .Release.Name | quote }}
      annotations:
        checksum/config: {{ include "thecrowler.configChecksum" . | quote }}
        checksum/secret: {{ include "thecrowler.secretChecksum" . | quote }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: crowler-api
          image: "{{ .Values.api.image.repository }}:{{ .Values.global.crowlerVersion }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: {{ include "thecrowler.secretName" . }}
                optional: true
          env:
            - name: INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POSTGRES_DB
              value: {{ .Values.database.name | quote }}
            - name: CROWLER_DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "thecrowler.secretName" . }}
                  key: DOCKER_CROWLER_DB_USER
            - name: CROWLER_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "thecrowler.secretName" . }}
                  key: DOCKER_CROWLER_DB_PASSWORD
            - name: POSTGRES_DB_HOST
              value: {{ include "thecrowler.databaseHost" . | quote }}
            - name: POSTGRES_DB_PORT
              value: {{ .Values.database.port | quote }}
            - name: POSTGRES_SSL_MODE
              value: {{ .Values.database.sslMode | quote }}
            - name: TZ
              value: {{ .Values.global.timezone | quote }}
            - name: MICROSERVICE_NAME
              value: crowler-api
          securityContext:
            readOnlyRootFilesystem: true
          readinessProbe:
            exec:
              command: ["./healthCheck", "-service", "api"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["./healthCheck", "-service", "api"]
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
{{ toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: crowler-config
              mountPath: /app/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: api-data
              mountPath: /app/data
      volumes:
        - name: crowler-config
          configMap:
            name: {{ include "thecrowler.configMapName" . }}
            items:
              - key: config.yaml
                path: config.yaml
        - name: api-data
          emptyDir: {}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
{{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
{{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
{{ toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
