{{- if .Values.events.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "thecrowler.eventsName" . }}
  labels:
    app.kubernetes.io/name: crowler-events
    {{- include "thecrowler.labels" . | nindent 4 }}
spec:
  type: {{ .Values.events.service.type }}
  selector:
    app.kubernetes.io/name: crowler-events
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
  ports:
    - name: http
      port: {{ .Values.events.service.port }}
      targetPort: http
{{- end }}
