{{- if .Values.database.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "thecrowler.dbHeadlessName" . }}
  labels:
    app.kubernetes.io/name: crowler-db
    {{- include "thecrowler.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: crowler-db
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
  ports:
    - name: postgres
      port: {{ .Values.database.port }}
      targetPort: postgres
{{- end }}
