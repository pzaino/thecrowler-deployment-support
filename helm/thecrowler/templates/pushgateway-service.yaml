{{- if .Values.pushgateway.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "thecrowler.pushgatewayName" . }}
  labels:
    app.kubernetes.io/name: crowler-push-gateway
    {{- include "thecrowler.labels" . | nindent 4 }}
spec:
  type: {{ .Values.pushgateway.service.type }}
  selector:
    app.kubernetes.io/name: crowler-push-gateway
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
  ports:
    - {name: http, port: 9091, targetPort: http}
{{- end }}
