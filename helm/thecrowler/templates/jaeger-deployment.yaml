{{- if .Values.jaeger.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "thecrowler.jaegerName" . }}
  labels:
    app.kubernetes.io/name: crowler-jaeger
    {{- include "thecrowler.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: crowler-jaeger
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crowler-jaeger
        app.kubernetes.io/part-of: thecrowler
        app.kubernetes.io/instance: {{ .Release.Name | quote }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: jaeger
          image: "{{ .Values.jaeger.image.repository }}:{{ .Values.jaeger.image.tag }}"
          imagePullPolicy: {{ .Values.jaeger.image.pullPolicy }}
          ports:
            - {name: ui, containerPort: 16686}
            - {name: otlp-grpc, containerPort: 4317}
          env:
            - {name: COLLECTOR_ZIPKIN_HTTP_PORT, value: "9411"}
            - {name: JAEGER_SERVICE_NAME, value: "crowler-jaeger"}
          readinessProbe:
            tcpSocket: {port: ui}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
{{ toYaml .Values.jaeger.resources | nindent 12 }}
      {{- with .Values.jaeger.nodeSelector }}
      nodeSelector:
{{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.jaeger.affinity }}
      affinity:
{{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.jaeger.tolerations }}
      tolerations:
{{ toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
